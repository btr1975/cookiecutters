---

extends: "default"

yaml-files:
  - "*.yaml"
  - "*.yml"

ignore:
  - "venv/"
  - ".venv/"
  - ".github/"

rules:
  line-length:
    max: 120
  comments-indentation: false
  comments:
    min-spaces-from-content: 1
  indentation:
    spaces: "consistent"
    indent-sequences: true
    check-multi-line-strings: false
  hyphens:
    max-spaces-after: 1
  new-lines:
    type: "unix"
  quoted-strings:
    quote-type: "double"
    required: true
    extra-required: []
    extra-allowed: []
    allow-quoted-quotes: false
    check-keys: false
  truthy:
    allowed-values: ["true", "false"]
    check-keys: true
  braces:
    max-spaces-inside: 1
  octal-values:
    forbid-implicit-octal: true
    forbid-explicit-octal: true
  trailing-spaces: {}
